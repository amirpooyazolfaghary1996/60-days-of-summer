<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1013">
<title>BoardWork 60</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --board:#0E1013; --panel:#191C21; --panel2:#20242B; --edge:#2B303A;
  --ink:#EEF1F5; --dim:#8B94A3; --faint:#5A6270;
  --blue:#3B82F6; --red:#E0483F; --green:#3FAA5A; --yellow:#E8C130;
  --ok:#3FAA5A;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono","DejaVu Sans Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--board);color:var(--ink);font-family:var(--sans);
  overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-0.03em}

/* ---- moulded-plastic display lettering ---- */
.display{font-weight:850;letter-spacing:-0.045em;line-height:0.95;text-transform:uppercase}
.d-xl{font-size:clamp(30px,9vw,42px)}
.d-lg{font-size:clamp(22px,6.4vw,30px)}
.mono{font-family:var(--mono)}
/* board-printed label: small caps + ring bullet, exactly like the silkscreen */
.chan{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:6px;color:var(--dim)}
.chan::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}

/* ---- the signature divider: a socket trace that jogs, like the board print ---- */
.trace{height:14px;width:100%;display:block;opacity:.85}

.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.screen{display:none;padding-top:calc(var(--safe-t) + 14px);padding-bottom:calc(84px + var(--safe-b))}
.screen.on{display:block}

.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px}
.card+.card{margin-top:10px}

/* ---- bottom nav ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,16,19,.94);
  backdrop-filter:blur(14px);border-top:1px solid var(--edge);
  padding:8px 0 calc(8px + var(--safe-b));display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
nav button.on{color:var(--ink)}
nav .dot{width:20px;height:20px;border-radius:6px;border:1.5px solid currentColor}
nav button.on .dot{background:currentColor}

/* ---- day grid ---- */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{aspect-ratio:1;border-radius:7px;border:1px solid var(--edge);background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;
  color:var(--faint);position:relative;overflow:hidden}
.cell b{position:relative;z-index:2;font-weight:500}
.cell .fill{position:absolute;inset:0;opacity:.22}
.cell.done{border-color:var(--ok)}
.cell.done .fill{opacity:.5}
.cell.today{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}
.cell.rest .fill{opacity:0}

/* ---- session player ---- */
#player{position:fixed;inset:0;z-index:60;background:var(--board);display:none;flex-direction:column}
#player.on{display:flex}
.pl-head{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 12px) 16px 10px}
.pl-body{flex:1;overflow-y:auto;padding:0 16px calc(160px + var(--safe-b))}
.pl-foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--board) 62%,transparent);
  padding:22px 16px calc(16px + var(--safe-b));z-index:61}

.stage{background:var(--panel);border:1px solid var(--edge);border-radius:16px;overflow:hidden;
  display:grid;grid-template-columns:1fr 108px}
@media(max-width:380px){.stage{grid-template-columns:1fr 90px}}
#rig{width:100%;display:block;background:
  radial-gradient(120% 100% at 50% 0%, #22262E 0%, #14171B 100%)}
.mapwrap{border-left:1px solid var(--edge);padding:10px 8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;background:#101317}

.setrow{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.setbtn{flex:1;min-width:56px;height:52px;border-radius:11px;border:1.5px solid var(--edge);
  background:var(--panel);font-family:var(--mono);font-size:15px;color:var(--dim);
  display:flex;align-items:center;justify-content:center;transition:.12s}
.setbtn.done{background:var(--ok);border-color:var(--ok);color:#08120B;font-weight:700}
.setbtn:active{transform:scale(.96)}

.big{width:100%;height:56px;border-radius:13px;background:var(--ink);color:var(--board);
  font-weight:800;letter-spacing:.02em;font-size:16px;display:flex;align-items:center;
  justify-content:center;gap:9px}
.big.ghost{background:transparent;border:1.5px solid var(--edge);color:var(--ink)}
.big:active{transform:scale(.985)}

.rest{position:fixed;inset:0;z-index:70;background:rgba(10,12,15,.97);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px}
.rest.on{display:flex}
.rest .num{font-family:var(--mono);font-size:clamp(64px,22vw,110px);font-weight:300;letter-spacing:-.04em}

ul.cues{margin:14px 0 0;padding:0;list-style:none;counter-reset:c}
ul.cues li{counter-increment:c;position:relative;padding-left:26px;margin-bottom:9px;color:#C6CCD6;font-size:14.5px}
ul.cues li::before{content:counter(c);position:absolute;left:0;top:1px;font-family:var(--mono);
  font-size:10px;color:var(--faint);border:1px solid var(--edge);border-radius:50%;
  width:17px;height:17px;display:flex;align-items:center;justify-content:center}

.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:4px 8px;border-radius:20px;border:1px solid var(--edge);color:var(--dim)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--dim)}.faint{color:var(--faint)}
.stat{font-family:var(--mono);font-size:26px;letter-spacing:-.03em}
.list button.item{display:block;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--edge)}
.list button.item:last-child{border-bottom:none}
input[type=search],input[type=number]{width:100%;background:var(--panel);border:1px solid var(--edge);
  border-radius:11px;padding:12px 14px;color:var(--ink);font:inherit}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
</style>
</head>
<body>

<!-- =============================== TODAY =============================== -->
<section class="screen on" id="s-today"><div class="wrap">
  <div class="row">
    <div>
      <div class="eyebrow" id="t-phase">Phase</div>
      <h1 class="display d-xl" id="t-title">Day 1</h1>
    </div>
    <button id="t-jump" class="pill">Change day</button>
  </div>
  <svg class="trace" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 7 H86 L96 1 H190 L200 13 H300" fill="none" stroke="#2B303A" stroke-width="1.5"/>
    <circle cx="96" cy="1" r="2.6" fill="#3B82F6"/><circle cx="200" cy="13" r="2.6" fill="#E8C130"/>
  </svg>
  <div id="t-body"></div>
</div></section>

<!-- =============================== PLAN ================================ -->
<section class="screen" id="s-plan"><div class="wrap">
  <div class="eyebrow">60-day sequence</div>
  <h1 class="display d-lg" style="margin-bottom:14px">The plan</h1>
  <div id="p-phases"></div>
  <div id="p-grid" style="margin-top:16px"></div>
  <div id="p-legend" style="margin-top:14px"></div>
</div></section>

<!-- ============================== LIBRARY ============================== -->
<section class="screen" id="s-lib"><div class="wrap">
  <div class="eyebrow">Every movement in the plan</div>
  <h1 class="display d-lg" style="margin-bottom:14px">Moves</h1>
  <input type="search" id="l-search" placeholder="Search movements or muscles" autocomplete="off">
  <div id="l-list" style="margin-top:14px"></div>
</div></section>

<!-- ============================= PROGRESS ============================== -->
<section class="screen" id="s-you"><div class="wrap">
  <div class="eyebrow">Where you are</div>
  <h1 class="display d-lg" style="margin-bottom:14px">Progress</h1>
  <div id="y-body"></div>
</div></section>

<!-- ============================== PLAYER =============================== -->
<div id="player">
  <div class="pl-head">
    <button id="pl-close" aria-label="Close session" style="font-size:26px;line-height:1;color:var(--dim)">&times;</button>
    <div style="flex:1;min-width:0">
      <div class="eyebrow" id="pl-block">Warm-up</div>
      <div class="display d-lg" id="pl-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</div>
    </div>
    <div class="mono faint" id="pl-count" style="font-size:12px">1/12</div>
  </div>
  <div class="pl-body">
    <div class="stage">
      <canvas id="rig" width="440" height="330"></canvas>
      <div class="mapwrap">
        <div id="pl-map"></div>
        <div class="chan" id="pl-chan" style="text-align:center;font-size:9px">—</div>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="display d-lg" id="pl-target">4 &times; 10</div>
      <div class="pill" id="pl-tempo">3s / rep</div>
    </div>
    <div id="pl-note" class="muted" style="font-size:13.5px;margin-top:8px"></div>
    <div class="setrow" id="pl-sets"></div>
    <ul class="cues" id="pl-cues"></ul>
    <div id="pl-extra" style="margin-top:16px"></div>
  </div>
  <div class="pl-foot">
    <button class="big" id="pl-next">Next movement</button>
  </div>
</div>

<div class="rest" id="rest">
  <div class="eyebrow">Rest</div>
  <div class="num" id="rest-num">75</div>
  <div class="mono faint" id="rest-next" style="font-size:12px">Up next: set 2</div>
  <button class="big ghost" id="rest-skip" style="width:200px">Skip rest</button>
</div>

<nav>
  <button class="on" data-go="today"><span class="dot"></span>Today</button>
  <button data-go="plan"><span class="dot"></span>Plan</button>
  <button data-go="lib"><span class="dot"></span>Moves</button>
  <button data-go="you"><span class="dot"></span>Progress</button>
</nav>

/* ============================================================ RIG RENDERER */
const BONES = [['shoulder','hip'],['shoulder','elbow'],['elbow','hand'],
               ['hip','knee'],['knee','foot']];
const FARB  = [['shoulder','elbow2'],['elbow2','hand2'],['hip','knee2'],['knee2','foot2']];

function lerp(a,b,t){ return a + (b-a)*t; }
function ease(u){ return u*u*(3-2*u); }

function samplePose(frames, t){
  t = Math.max(0, Math.min(0.999999, t));
  for(let i=0;i<frames.length-1;i++){
    const {t:t0,p:p0} = frames[i], {t:t1,p:p1} = frames[i+1];
    if(t >= t0 && t <= t1){
      const u = t1===t0 ? 0 : ease((t-t0)/(t1-t0));
      const keys = new Set([...Object.keys(p0), ...Object.keys(p1)]);
      const out = {};
      for(const k of keys){
        const a = p0[k] || p1[k], b = p1[k] || p0[k];
        out[k] = [lerp(a[0],b[0],u), lerp(a[1],b[1],u)];
      }
      return out;
    }
  }
  return frames[frames.length-1].p;
}

class Rig{
  constructor(canvas){
    this.c = canvas; this.ctx = canvas.getContext('2d');
    this.ex = null; this.t0 = 0; this.flip = false; this.raf = null;
    this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.resize();
    addEventListener('resize', () => this.resize());
  }
  resize(){
    const dpr = Math.min(devicePixelRatio||1, 3);
    const r = this.c.getBoundingClientRect();
    if(!r.width) return;
    this.c.width = Math.round(r.width*dpr);
    this.c.height = Math.round(r.width*0.75*dpr);
    this.c.style.height = Math.round(r.width*0.75)+'px';
    this.dpr = dpr;
  }
  set(ex){
    this.ex = ex; this.t0 = performance.now(); this.flip = false;
    this.resize();
    if(!this.raf) this.loop();
  }
  stop(){ if(this.raf){ cancelAnimationFrame(this.raf); this.raf = null; } }
  loop(){
    this.raf = requestAnimationFrame(() => this.loop());
    this.draw();
  }
  draw(){
    const ex = this.ex; if(!ex) return;
    const ctx = this.ctx, W = this.c.width, H = this.c.height, d = this.dpr;
    ctx.clearRect(0,0,W,H);

    const cycle = (ex.tempo||3) * 1000;
    let phase = ((performance.now() - this.t0) % cycle) / cycle;
    if(this.reduced) phase = 0.5;
    if(ex.mirror){
      const n = Math.floor((performance.now()-this.t0)/cycle);
      this.flip = (n % 2) === 1;
    } else this.flip = false;

    const pad = 16*d;
    const s = Math.min((W-pad*2)/100, (H-pad*2)/100);
    const ox = (W - 100*s)/2, oy = (H - 100*s)/2;
    const X = x => ox + (this.flip ? (100-x) : x)*s;
    const Y = y => oy + y*s;

    /* floor */
    ctx.strokeStyle = '#2B303A'; ctx.lineWidth = 1.5*d;
    ctx.beginPath(); ctx.moveTo(ox, Y(92)); ctx.lineTo(ox+100*s, Y(92)); ctx.stroke();

    const pose = samplePose(ex.frames, phase);

    /* equipment props */
    ctx.strokeStyle = '#49525F'; ctx.fillStyle = 'rgba(73,82,95,.16)';
    ctx.lineWidth = 2*d; ctx.lineJoin = 'round';
    for(const p of (ex.props||[])){
      ctx.beginPath();
      if(p.kind==='box'){
        ctx.rect(X(this.flip ? p.x+p.w : p.x), Y(p.y), p.w*s, p.h*s);
        ctx.fill(); ctx.stroke();
      } else if(p.kind==='wall'){
        ctx.moveTo(X(p.x), Y(2)); ctx.lineTo(X(p.x), Y(92)); ctx.stroke();
      } else if(p.kind==='bar'){
        ctx.moveTo(X(p.x1), Y(p.y1)); ctx.lineTo(X(p.x2), Y(p.y2)); ctx.stroke();
      } else if(p.kind==='strap'){
        const h = pose.hand; if(h){ ctx.moveTo(X(h[0]),Y(h[1])); ctx.lineTo(X(p.x),Y(p.y)); ctx.stroke(); }
      }
    }

    const P = k => pose[k] ? [X(pose[k][0]), Y(pose[k][1])] : null;
    const seg = (a,b) => { const A=P(a), B=P(b); if(A&&B){ ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke(); } };

    ctx.lineCap = 'round';
    /* far limbs */
    ctx.strokeStyle = '#5E6775'; ctx.lineWidth = 4.5*d;
    FARB.forEach(([a,b]) => seg(a,b));

    /* near limbs */
    const accent = ex.board ? PORTS[ex.board].color : '#EEF1F5';
    ctx.strokeStyle = '#EEF1F5'; ctx.lineWidth = 6*d;
    BONES.forEach(([a,b]) => seg(a,b));

    /* neck: stop at the skull edge so the line never runs into the head */
    const hd = P('head'), sh = P('shoulder');
    const R = 7.2*s;
    if(hd && sh){
      const dx = hd[0]-sh[0], dy = hd[1]-sh[1], L = Math.hypot(dx,dy) || 1;
      ctx.beginPath(); ctx.moveTo(sh[0], sh[1]);
      ctx.lineTo(hd[0]-dx/L*R, hd[1]-dy/L*R); ctx.stroke();
      ctx.beginPath(); ctx.arc(hd[0], hd[1], R, 0, 6.284); ctx.stroke();
    }
    /* working joints in the channel colour */
    ctx.fillStyle = accent;
    for(const k of ['hand','elbow','knee','foot']){
      const p = P(k); if(!p) continue;
      ctx.beginPath(); ctx.arc(p[0], p[1], 3.6*d, 0, 6.284); ctx.fill();
    }
  }
}

const SET_SOCKETS = {
  'blue-wide':['S1','S2'], 'blue-outer':['S3','S4'], 'yellow':['S5','S6'],
  'red-outer':['S7','S8'], 'green-inner':['S11','S12'], 'red-center':['S13','S14']
};
const TRACES = [
  ['blue',  [[16,24],[50,20],[84,24]]],
  ['blue',  [[30,36],[70,36]]],
  ['yellow',[[20,48],[50,20],[80,48]]],
  ['green', [[38,52],[50,60],[62,52]]],
  ['green', [[40,70],[50,60],[60,70]]],
  ['red',   [[26,60],[50,66],[74,60]]],
  ['red',   [[30,82],[50,66],[70,82]]]
];
function portMap(boardKey, size){
  const active = SET_SOCKETS[boardKey] || [];
  const P = pts => pts.map(p => p.join(',')).join(' ');
  let svg = `<svg viewBox="-6 8 112 88" width="${size}" height="${size*0.79}" role="img" aria-label="Push-up board socket map">`;
  svg += `<rect x="2" y="10" width="96" height="84" rx="12" fill="#15181D" stroke="#2B303A"/>`;
  for(const [ch,pts] of TRACES)
    svg += `<polyline points="${P(pts)}" fill="none" stroke="${CHAN[ch]}" stroke-opacity="${active.length?0.16:0.4}" stroke-width="2.6" stroke-linejoin="round"/>`;
  for(const [id,x,y,ch] of SOCKETS){
    const on = active.includes(id);
    svg += `<circle cx="${x}" cy="${y}" r="${on?5.4:3.2}" fill="${on?CHAN[ch]:'#252A32'}" `
        +  `stroke="${on?CHAN[ch]:'#333944'}" stroke-width="${on?2.4:1}" ${on?'fill-opacity="1"':''}/>`;
    if(on) svg += `<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="${CHAN[ch]}" stroke-opacity=".35" stroke-width="1.4"/>`;
  }
  svg += `</svg>`;
  return svg;
}

/* ==================================================================== VIEWS */
const $ = s => document.querySelector(s);
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dayOf(n){ return PLAN.days[n-1]; }
function itemsOf(day){
  const out = [];
  day.blocks.forEach(b => b.items.forEach(i => out.push({...i, block:b.name})));
  return out;
}

/* ---------------------------------------------------------------- TODAY */
function renderToday(){
  const n = ST.current, day = dayOf(n);
  const ph = PLAN.phases.find(p => p.id === day.phase);
  $('#t-phase').textContent = `Phase ${ph.id} · ${ph.name} · Week ${day.week}`;
  $('#t-title').textContent = `Day ${n} — ${day.title}`;

  const body = $('#t-body');
  if(day.key === 'rest'){
    body.innerHTML = `<div class="card">
      <div class="chan" style="color:var(--faint)">Rest</div>
      <p style="margin:10px 0 0">Nothing scheduled. Walk, sleep well, eat enough. Muscle is built on the days you do not train.</p>
    </div>
    <button class="big ghost" style="margin-top:12px" onclick="markDone(${n});renderToday();renderPlan();">Mark day complete</button>`;
    return;
  }

  const done = !!ST.done[n];
  let h = `<div class="card">
    <div class="row">
      <div><div class="chan">${esc(day.subtitle)}</div>
      <div class="mono faint" style="font-size:12px;margin-top:6px">
        ~${day.estimatedMinutes} min · ${day.restSeconds}s rest${day.deload?' · DELOAD':''}</div></div>
      ${done?'<span class="pill" style="color:var(--ok);border-color:var(--ok)">Done</span>':''}
    </div>
    <p style="margin:12px 0 0;color:#C6CCD6;font-size:14px">${esc(day.intensityNote)}</p>
  </div>`;

  day.blocks.filter(b => b.items.length).forEach(b => {
    h += `<div class="card"><div class="eyebrow" style="margin-bottom:10px">${esc(b.name)}</div><div class="list">`;
    b.items.forEach(i => {
      const e = EX[i.exercise];
      const t = i.unit === 'max' ? 'Max effort' :
                `${i.sets} × ${i.target}${i.unit==='sec'?'s':''}${e.unilateral?' / side':''}`;
      const c = e.board ? PORTS[e.board].color : '#5A6270';
      h += `<div class="item row" style="padding:11px 0;border-bottom:1px solid var(--edge)">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <span style="width:8px;height:8px;border-radius:50%;background:${c};flex:none"></span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.name)}</span>
        </div>
        <span class="mono faint" style="font-size:12px;flex:none">${t}</span></div>`;
    });
    h += `</div></div>`;
  });

  h += `<button class="big" style="margin-top:14px" onclick="startSession(${n})">
          ${done?'Repeat this session':'Start session'}</button>`;
  if(!done) h += `<button class="big ghost" style="margin-top:9px" onclick="markDone(${n});renderToday();renderPlan();">
          Log without the timer</button>`;
  body.innerHTML = h;
}

/* ----------------------------------------------------------------- PLAN */
function renderPlan(){
  $('#p-phases').innerHTML = PLAN.phases.map(p => `
    <div class="card" style="padding:13px 15px">
      <div class="row"><div class="chan">Phase ${p.id} · ${esc(p.name)}</div>
      <span class="mono faint" style="font-size:11px">Days ${p.startDay}–${p.endDay}</span></div>
      <div style="margin-top:7px;font-size:13.5px;color:#C6CCD6">${esc(p.focus)}</div>
    </div>`).join('');

  $('#p-grid').innerHTML = `<div class="grid">` + PLAN.days.map(d => {
    const c = DAYCOLOR[d.key] || '#5A6270';
    return `<button class="cell ${ST.done[d.day]?'done':''} ${d.day===ST.current?'today':''} ${d.key==='rest'?'rest':''}"
      onclick="ST.current=${d.day};save();go('today')" aria-label="Day ${d.day} ${esc(d.title)}">
      <span class="fill" style="background:${c}"></span><b>${d.day}</b></button>`;
  }).join('') + `</div>`;

  const seen = {};
  PLAN.days.forEach(d => seen[d.key] = d.title);
  $('#p-legend').innerHTML = Object.entries(seen).map(([k,t]) =>
    `<span class="pill" style="margin:0 6px 6px 0;border-color:${DAYCOLOR[k]};color:${DAYCOLOR[k]}">${esc(t)}</span>`
  ).join('');
}

/* -------------------------------------------------------------- LIBRARY */
function renderLib(q=''){
  q = q.toLowerCase().trim();
  const groups = ['chest','shoulders','triceps','back','legs','core','mobility'];
  let h = '';
  groups.forEach(g => {
    const list = LIB.exercises.filter(e => e.group===g && (!q ||
      e.name.toLowerCase().includes(q) || e.muscles.join(' ').toLowerCase().includes(q)));
    if(!list.length) return;
    h += `<div class="eyebrow" style="margin:18px 0 8px">${g}</div><div class="card list">`;
    list.forEach(e => {
      const c = e.board ? PORTS[e.board].color : '#5A6270';
      h += `<button class="item" onclick="openMove('${e.id}')">
        <div class="row"><div style="display:flex;align-items:center;gap:10px;min-width:0">
        <span style="width:8px;height:8px;border-radius:50%;background:${c};flex:none"></span>
        <span>${esc(e.name)}</span></div>
        <span class="mono faint" style="font-size:11px;flex:none">${e.kind==='time'?'hold':'reps'}</span></div>
        <div class="faint" style="font-size:12.5px;margin-top:3px;padding-left:18px">${esc(e.muscles.slice(0,3).join(' · '))}</div>
      </button>`;
    });
    h += `</div>`;
  });
  $('#l-list').innerHTML = h || `<div class="card muted">Nothing matches that. Try a muscle name.</div>`;
}
$('#l-search').addEventListener('input', e => renderLib(e.target.value));

/* ------------------------------------------------------------- PROGRESS */
function renderYou(){
  const doneDays = Object.keys(ST.done).length;
  const trainDays = PLAN.days.filter(d => d.key!=='rest').length;
  const streak = (() => { let s=0; for(let i=ST.current-1;i>=1;i--){ if(ST.done[i]) s++; else break; } return s; })();
  const t = ST.tests || {};

  $('#y-body').innerHTML = `
  <div class="card"><div class="row">
    <div><div class="eyebrow">Days logged</div><div class="stat">${doneDays}<span class="faint" style="font-size:14px">/60</span></div></div>
    <div><div class="eyebrow">Sessions</div><div class="stat">${Object.keys(ST.log).length}</div></div>
    <div><div class="eyebrow">Streak</div><div class="stat">${streak}</div></div>
  </div></div>

  <div class="card">
    <div class="eyebrow" style="margin-bottom:4px">Benchmarks</div>
    <p class="muted" style="font-size:13.5px;margin:0 0 12px">
      Run these on day 1 and again on day 60. One all-out set each.</p>
    ${['pushup_standard','pike_pushup','pushup_diamond','bulgarian_split','table_row','plank','hollow_hold']
      .map(id => `<div class="row" style="padding:9px 0;border-bottom:1px solid var(--edge)">
        <span style="font-size:14px">${esc(EX[id].name)}</span>
        <span style="display:flex;gap:6px;align-items:center">
          <input type="number" inputmode="numeric" style="width:62px;padding:7px;text-align:center"
            placeholder="d1" value="${t[id+'.1']??''}" onchange="setTest('${id}.1',this.value)">
          <input type="number" inputmode="numeric" style="width:62px;padding:7px;text-align:center"
            placeholder="d60" value="${t[id+'.60']??''}" onchange="setTest('${id}.60',this.value)">
        </span></div>`).join('')}
  </div>

  <div class="card">
    <div class="eyebrow" style="margin-bottom:10px">Eating for this</div>
    <p style="margin:0;font-size:14px;color:#C6CCD6">
      At 188 cm and 70 kg you are on the lean side, so the training only pays off if the food is there.
      Aim for roughly 110–150 g of protein a day and a small surplus — a few hundred calories over
      maintenance, not more. If the scale has not moved by day 20, add food rather than sets.
      Sleep is the other half; seven to nine hours does more for recovery than any programme change.</p>
  </div>

  <button class="big ghost" style="margin-top:12px" onclick="resetAll()">Reset all progress</button>`;
}
function setTest(k,v){ ST.tests[k] = v; save(); }
function resetAll(){
  if(!confirm('Clear every logged day and benchmark? This cannot be undone.')) return;
  ST = {v:1,current:1,done:{},log:{},tests:{}}; save(); renderAll(); go('today');
}

/* -------------------------------------------------------- MOVE DETAIL */
let libRig = null;
function openMove(id){
  const e = EX[id];
  const sheet = el(`<div style="position:fixed;inset:0;z-index:80;background:var(--board);overflow-y:auto;
      padding:calc(var(--safe-t) + 14px) 18px calc(30px + var(--safe-b))">
    <div class="wrap" style="padding:0">
      <button style="font-size:26px;color:var(--dim);margin-bottom:6px" aria-label="Close">&times;</button>
      <div class="chan">${esc(e.group)}</div>
      <h2 class="display d-lg" style="margin:6px 0 14px">${esc(e.name)}</h2>
      <div class="stage"><canvas class="mv" width="440" height="330"></canvas>
        <div class="mapwrap">${portMap(e.board, 88)}
        <div class="chan" style="font-size:9px;text-align:center">${e.board?esc(PORTS[e.board].label):'No board'}</div></div>
      </div>
      ${e.board?`<p class="muted" style="font-size:13.5px;margin-top:10px">${esc(PORTS[e.board].note)}</p>`:''}
      <ul class="cues">${e.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      <div style="margin-top:16px">${e.muscles.map(m => `<span class="pill" style="margin:0 6px 6px 0">${esc(m)}</span>`).join('')}</div>
      ${e.regression?`<div class="card" style="margin-top:14px"><div class="eyebrow">Too hard</div>
        <div style="margin-top:6px">${esc(e.regression)}</div></div>`:''}
      ${e.progression?`<div class="card"><div class="eyebrow">Too easy</div>
        <div style="margin-top:6px">${esc(e.progression)}</div></div>`:''}
      ${e.substitute?`<div class="card"><div class="eyebrow">No safe anchor</div>
        <div style="margin-top:6px">${esc(e.substitute)}</div></div>`:''}
    </div></div>`);
  document.body.appendChild(sheet);
  const r = new Rig(sheet.querySelector('.mv')); r.set(e);
  sheet.querySelector('button').onclick = () => { r.stop(); sheet.remove(); };
}

/* ================================================================ SESSION */
let S = null, rig = null, restTimer = null, wake = null;

async function startSession(n){
  const day = dayOf(n);
  const items = itemsOf(day).filter(i => i.sets > 0);
  if(!items.length) return;
  S = {day:n, items, i:0, sets:{}, rest:day.restSeconds};
  $('#player').classList.add('on');
  if(!rig) rig = new Rig($('#rig'));
  try{ wake = await navigator.wakeLock?.request('screen'); }catch(e){}
  paintStep();
}

function paintStep(){
  const it = S.items[S.i], e = EX[it.exercise];
  $('#pl-block').textContent = it.block;
  $('#pl-name').textContent = e.name;
  $('#pl-count').textContent = `${S.i+1}/${S.items.length}`;
  $('#pl-target').innerHTML = it.unit === 'max'
    ? 'Max effort'
    : `${it.sets} <span class="faint">&times;</span> ${it.target}${it.unit==='sec'?'s':''}`;
  $('#pl-tempo').textContent = e.unilateral ? 'Each side' : `${e.tempo}s per rep`;
  $('#pl-note').textContent = it.note || (e.kind==='time' ? 'Hold, do not count reps.' : '');
  $('#pl-map').innerHTML = portMap(e.board, 84);
  $('#pl-chan').textContent = e.board ? PORTS[e.board].label : 'Mat only';
  $('#pl-cues').innerHTML = e.cues.map(c => `<li>${esc(c)}</li>`).join('');

  const extra = [];
  if(e.board) extra.push(`<div class="card"><div class="eyebrow">Handle placement</div>
    <div style="margin-top:6px;font-size:14px">${esc(PORTS[e.board].note)}</div></div>`);
  if(e.regression) extra.push(`<div class="card"><div class="eyebrow">Too hard</div>
    <div style="margin-top:6px;font-size:14px">${esc(e.regression)}</div></div>`);
  if(e.substitute) extra.push(`<div class="card"><div class="eyebrow">No safe anchor</div>
    <div style="margin-top:6px;font-size:14px">${esc(e.substitute)}</div></div>`);
  $('#pl-extra').innerHTML = extra.join('');

  const key = S.i;
  S.sets[key] = S.sets[key] || 0;
  const row = $('#pl-sets'); row.innerHTML = '';
  for(let k=0;k<it.sets;k++){
    const b = el(`<button class="setbtn ${k < S.sets[key] ? 'done':''}">${k+1}</button>`);
    b.onclick = () => logSet(k+1);
    row.appendChild(b);
  }
  $('#pl-next').textContent = S.i === S.items.length-1 ? 'Finish session' : 'Next movement';
  rig.set(e);
}

function logSet(k){
  const key = S.i, it = S.items[key];
  S.sets[key] = (S.sets[key] === k) ? k-1 : k;
  paintStepSets();
  if(S.sets[key] === it.sets){
    if(S.i < S.items.length-1){ S.i++; paintStep(); startRest('Next: ' + EX[S.items[S.i].exercise].name); }
    else finishSession();
  } else if(S.sets[key] === k){
    startRest(`Set ${k+1} of ${it.sets}`);
  }
}
function paintStepSets(){
  const it = S.items[S.i], done = S.sets[S.i] || 0;
  [...$('#pl-sets').children].forEach((b,k) => b.classList.toggle('done', k < done));
}

$('#pl-next').onclick = () => {
  if(S.i < S.items.length-1){ S.i++; paintStep(); }
  else finishSession();
};
$('#pl-close').onclick = () => closeSession();

function closeSession(){
  clearInterval(restTimer); $('#rest').classList.remove('on');
  $('#player').classList.remove('on');
  rig && rig.stop(); rig = null;
  try{ wake && wake.release(); }catch(e){} wake = null;
}
function finishSession(){
  markDone(S.day);
  ST.log[S.day] = {at: Date.now(), sets: S.sets};
  if(S.day < 60) ST.current = S.day + 1;
  save(); closeSession(); renderAll(); go('today');
}
function markDone(n){ ST.done[n] = true; if(n < 60 && ST.current === n) ST.current = n+1; save(); }

/* ------------------------------------------------------------------ REST */
function startRest(label){
  const secs = S.rest;
  let left = secs;
  $('#rest-next').textContent = label;
  $('#rest-num').textContent = left;
  $('#rest').classList.add('on');
  clearInterval(restTimer);
  restTimer = setInterval(() => {
    left--;
    $('#rest-num').textContent = Math.max(0,left);
    if(left <= 0){ clearInterval(restTimer); $('#rest').classList.remove('on'); beep(); }
  }, 1000);
}
$('#rest-skip').onclick = () => { clearInterval(restTimer); $('#rest').classList.remove('on'); };

let actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18].forEach((d,i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = i ? 880 : 660; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, actx.currentTime+d);
      g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime+d+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d+0.14);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime+d); o.stop(actx.currentTime+d+0.16);
    });
    navigator.vibrate && navigator.vibrate([120,60,120]);
  }catch(e){}
}

/* --------------------------------------------------------------- ROUTING */
function go(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's'+'-'+name));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.go === name));
  scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.go));
$('#t-jump').onclick = () => {
  const v = prompt('Jump to which day? (1–60)', ST.current);
  const n = parseInt(v,10);
  if(n >= 1 && n <= 60){ ST.current = n; save(); renderAll(); }
};

if(location.protocol.startsWith('http') && 'serviceWorker' in navigator){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

function renderAll(){ renderToday(); renderPlan(); renderLib($('#l-search').value); renderYou(); }
renderAll();
</script>
</body>
